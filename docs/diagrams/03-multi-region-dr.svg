<rect width="1200" height="975" fill="#ffffff"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#16191f" text-anchor="start">Project 03 · Multi-region disaster recovery (warm standby)</text>
<text x="1160" y="44" font-size="12" font-weight="normal" fill="#5f6b7a" text-anchor="end">github.com/Bernard-Baah/aws-architect-portfolio</text>
<text x="40" y="68" font-size="13.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">One URL, two regions. Reads fail over per request with no errors; writes move with a one-command promotion.</text>
<rect x="40" y="108" width="120" height="52" rx="6" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.2"/>
<rect x="40" y="108" width="5" height="52" rx="2" fill="#16191f"/>
<text x="54" y="128" font-size="13" font-weight="600" fill="#16191f" text-anchor="start">Users</text>
<text x="54" y="144" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">browser</text>
<rect x="370" y="92" width="460" height="86" rx="6" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.2"/>
<rect x="370" y="92" width="5" height="86" rx="2" fill="#8c4fff"/>
<text x="384" y="112" font-size="13" font-weight="600" fill="#16191f" text-anchor="start">Amazon CloudFront + AWS WAF</text>
<text x="384" y="128" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">one HTTPS URL · origin group (GET/HEAD/OPTIONS)</text>
<text x="384" y="144" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">primary first; standby on 500/502/503/504</text>
<text x="384" y="160" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">or primary connect timeout (1 attempt, 2 s)</text>
