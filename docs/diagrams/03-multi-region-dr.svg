<rect x="656" y="268" width="488" height="300" rx="8" fill="none" stroke="#8c4fff" stroke-width="2"/>
<text x="1132" y="288" font-size="12" font-weight="600" fill="#8c4fff" text-anchor="end">VPC 10.1.0.0/16</text>
<rect x="76" y="300" width="440" height="52" rx="6" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.2"/>
<rect x="76" y="300" width="5" height="52" rx="2" fill="#8c4fff"/>
<text x="90" y="320" font-size="13" font-weight="600" fill="#16191f" text-anchor="start">Internal ALB</text>
<text x="90" y="336" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">no public IP · ingress only from CloudFront's prefix list</text>
<rect x="76" y="380" width="440" height="68" rx="6" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.2"/>
<rect x="76" y="380" width="5" height="68" rx="2" fill="#ed7100"/>
<text x="90" y="400" font-size="13" font-weight="600" fill="#16191f" text-anchor="start">Auto Scaling group · 2 × t4g.micro</text>
<text x="90" y="416" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">us-east-1a + us-east-1b · ELB health checks</text>
<text x="90" y="432" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">reads DB credentials from Secrets Manager at boot</text>
<rect x="76" y="476" width="440" height="68" rx="6" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.2"/>
<rect x="76" y="476" width="5" height="68" rx="2" fill="#2e5fa8"/>
<text x="90" y="496" font-size="13" font-weight="600" fill="#16191f" text-anchor="start">RDS PostgreSQL 17 · primary</text>
<text x="90" y="512" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">encrypted · backups on (required for a replica)</text>
<text x="90" y="528" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">password set via write-only attribute</text>
<rect x="76" y="600" width="440" height="68" rx="6" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.2"/>
<rect x="76" y="600" width="5" height="68" rx="2" fill="#dd344c"/>
<text x="90" y="620" font-size="13" font-weight="600" fill="#16191f" text-anchor="start">Secrets Manager · db-credentials</text>
<text x="90" y="636" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">value written with secret_string_wo</text>
<text x="90" y="652" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">never in Terraform state</text>
<rect x="676" y="300" width="440" height="52" rx="6" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.2"/>
<rect x="676" y="300" width="5" height="52" rx="2" fill="#8c4fff"/>
<text x="690" y="320" font-size="13" font-weight="600" fill="#16191f" text-anchor="start">Internal ALB</text>
<text x="690" y="336" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">same module, same security group chain</text>
<rect x="676" y="380" width="440" height="68" rx="6" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.2"/>
<rect x="676" y="380" width="5" height="68" rx="2" fill="#ed7100"/>
<text x="690" y="400" font-size="13" font-weight="600" fill="#16191f" text-anchor="start">Auto Scaling group · 1 × t4g.micro (warm)</text>
<text x="690" y="416" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">scaled to 2 by promote-standby.sh</text>
<text x="690" y="432" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">serves reads immediately on failover</text>
<rect x="676" y="476" width="440" height="68" rx="6" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.2"/>
<rect x="676" y="476" width="5" height="68" rx="2" fill="#2e5fa8"/>
<text x="690" y="496" font-size="13" font-weight="600" fill="#16191f" text-anchor="start">RDS read replica → promoted on failover</text>
<text x="690" y="512" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">own-region KMS key · ignore_changes on its source</text>
<text x="690" y="528" font-size="11.5" font-weight="normal" fill="#5f6b7a" text-anchor="start">writable 290 s after promotion started</text>
<rect x="676" y="600" width="440" height="68" rx="6" fill="#ffffff" stroke="#c6ccd5" stroke-width="1.2"/>
<rect x="676" y="600" width="5" height="68" rx="2" fill="#dd344c"/>
