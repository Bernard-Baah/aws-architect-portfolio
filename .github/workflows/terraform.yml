name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt-validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: |
          files=$(terraform fmt -check -recursive || true)
          if [ -n "$files" ]; then
            for f in $files; do
              # One annotation per file, showing the exact diff on the PR
              d=$(terraform fmt -diff -write=false "$f" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
              echo "::error file=$f,title=Not formatted (run terraform fmt -recursive)::$d"
            done
            exit 1
          fi

      - name: terraform validate (every module)
        run: |
          set +e -uo pipefail
          # Any directory containing .tf files, excluding .terraform caches
          dirs=$(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          failed=0
          for d in $dirs; do
            # Modules that need an aliased provider (configuration_aliases) can't be
            # validated standalone; Terraform validates them through the root
            # stack that passes the providers in (e.g. 01-ha-web-app -> modules/edge).
            if grep -q configuration_aliases "$d"/*.tf; then
              echo "::notice title=validate skipped::$d needs aliased providers; validated through its root stack"
              continue
            fi
            echo "::group::$d"
            if ! terraform -chdir="$d" init -backend=false -input=false > /tmp/init.log 2>&1; then
              cat /tmp/init.log
              echo "::error title=terraform init failed::$d"
              failed=1
              echo "::endgroup::"
              continue
            fi
            out=$(terraform -chdir="$d" validate -json) || true
            echo "$out" | jq -r '.diagnostics[] | "\(.severity): \(.summary) \(.detail // "")"'
            # Surface each error as a PR annotation on the right file and line
            echo "$out" | jq -r --arg d "${d#./}" '.diagnostics[] | select(.severity=="error")
              | "::error file=\($d)/\(.range.filename // ""),line=\(.range.start.line // 1),title=\(.summary)::\((.detail // "") | gsub("\n"; "%0A"))"'
            [ "$(echo "$out" | jq -r .valid)" = "true" ] || failed=1
            echo "::endgroup::"
          done
          exit $failed

  python-tests:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # same runtime as the Lambda functions

      - name: unit tests (Lambda handlers + Step Functions definition)
        run: python -m unittest discover -s 02-serverless-pipeline/tests -v

  # Signs in to AWS through GitHub OIDC (no stored keys) and runs a read-only
  # terraform plan for every deployed stack. Skipped until the AWS_ROLE_ARN
  # repository variable exists.
  plan:
    name: plan (${{ matrix.stack }})
    needs: fmt-validate
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job request a GitHub OIDC token
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Add each project's root folder here once it's deployed.
        # (00-setup/bootstrap-backend is excluded: it keeps local state.)
        stack:
          - 00-setup/github-oidc
          - 01-ha-web-app
          - 02-serverless-pipeline
          - 03-multi-region-dr
    env:
      TF_STATE_BUCKET: bernard-tfstate-40b007
      TF_VAR_state_bucket_name: bernard-tfstate-40b007
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Who am I?
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: terraform -chdir="${{ matrix.stack }}" init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: terraform plan
        run: terraform -chdir="${{ matrix.stack }}" plan -input=false -lock-timeout=60s
