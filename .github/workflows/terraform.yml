name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt-validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (every root module)
        run: |
          set -euo pipefail
          # Any directory containing .tf files, excluding .terraform caches
          dirs=$(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          for d in $dirs; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

  # Signs in to AWS through GitHub OIDC (no stored keys) and runs a read-only
  # terraform plan for every deployed stack. Skipped until the AWS_ROLE_ARN
  # repository variable exists.
  plan:
    name: plan (${{ matrix.stack }})
    needs: fmt-validate
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job request a GitHub OIDC token
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Add each project's root folder here once it's deployed.
        # (00-setup/bootstrap-backend is excluded: it keeps local state.)
        stack:
          - 00-setup/github-oidc
    env:
      TF_STATE_BUCKET: bernard-tfstate-40b007
      TF_VAR_state_bucket_name: bernard-tfstate-40b007
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Who am I?
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: terraform -chdir="${{ matrix.stack }}" init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: terraform plan
        run: terraform -chdir="${{ matrix.stack }}" plan -input=false -lock-timeout=60s
