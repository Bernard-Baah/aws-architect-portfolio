AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AWS Config recorder for one account and region, delivering to the central
  bucket in Log Archive. Deployed to every member account by a service-managed
  StackSet (04-landing-zone/security/config.tf).

Parameters:
  DeliveryBucket:
    Type: String
    Description: Central Config bucket in the Log Archive account
  HomeRegion:
    Type: String
    Default: us-east-1
    Description: Only this region records global resources (IAM), so they aren't counted twice

Conditions:
  IsHomeRegion: !Equals [!Ref "AWS::Region", !Ref HomeRegion]

Resources:
  # One role per region: IAM is global, so a fixed name would collide when
  # the StackSet deploys the second region into the same account.
  ConfigRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub config-recorder-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWS_ConfigRole
      Policies:
        - PolicyName: deliver-to-log-archive
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${DeliveryBucket}/AWSLogs/${AWS::AccountId}/*
                Condition:
                  StringEquals:
                    s3:x-amz-acl: bucket-owner-full-control
              - Effect: Allow
                Action: s3:GetBucketAcl
                Resource: !Sub arn:aws:s3:::${DeliveryBucket}

  Recorder:
    Type: AWS::Config::ConfigurationRecorder
    Properties:
      Name: default
      RoleARN: !GetAtt ConfigRole.Arn
      RecordingGroup:
        AllSupported: true
        IncludeGlobalResourceTypes: !If [IsHomeRegion, true, false]
      # Daily snapshots instead of continuous recording: a fraction of the
      # cost, still enough for Security Hub to evaluate controls.
      RecordingMode:
        RecordingFrequency: DAILY

  # A delivery channel can only be created once a recorder exists.
  DeliveryChannel:
    Type: AWS::Config::DeliveryChannel
    DependsOn: Recorder
    Properties:
      Name: default
      S3BucketName: !Ref DeliveryBucket
      ConfigSnapshotDeliveryProperties:
        DeliveryFrequency: TwentyFour_Hours
